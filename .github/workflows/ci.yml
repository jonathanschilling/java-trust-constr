name: CI

# Build and test on every push to master and on every pull request.
# The parent POM `de.labathome:de-labathome-parent:1.1.0` is on Maven Central,
# so this resolves with no extra setup.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The scipy/ submodule is the upstream Python reference; it's not
        # needed to build or test the Java port, so we leave submodules
        # unpopulated to keep the checkout fast.

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -e test

      - name: Build javadoc (lint check)
        run: mvn -B -e javadoc:javadoc

      - name: Verify ASCII-only invariant
        run: |
          python3 -c "
          import os, sys
          violations = []
          for dirpath, dirs, files in os.walk('.'):
              for skip in ['.git', 'target', 'scipy', 'node_modules']:
                  if skip in dirs:
                      dirs.remove(skip)
              for fn in files:
                  path = os.path.join(dirpath, fn)
                  try:
                      with open(path, 'rb') as f:
                          data = f.read()
                  except Exception:
                      continue
                  if any(b > 127 for b in data):
                      violations.append(path)
          if violations:
              print('Non-ASCII bytes detected (HARD rule violated):')
              for p in violations:
                  print(f'  {p}')
              sys.exit(1)
          print('ASCII check passed.')
          "
