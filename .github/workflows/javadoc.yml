name: Deploy Javadoc to gh-pages

# Builds the javadoc and publishes it to the `gh-pages` branch on every push
# to `master` and on every release tag. Also exposed as a manual dispatch
# button on the Actions tab.
#
# One-time GitHub setup:
#   1. Settings -> Pages -> Source: "Deploy from a branch" -> Branch: `gh-pages`,
#      folder: `/ (root)`. Save.
#   2. Settings -> Actions -> General -> Workflow permissions:
#      "Read and write permissions" so the workflow can push to gh-pages.
#   3. Run this workflow once (manually) to seed the gh-pages branch.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build javadoc
        # The parent POM `de.labathome:de-labathome-parent:1.1.0` is on Maven
        # Central, so this resolves with no extra setup.
        run: mvn -B -q javadoc:javadoc

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/reports/apidocs
          publish_branch: gh-pages
          force_orphan: true   # keep gh-pages a single-commit history
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update javadoc from ${{ github.sha }}'
