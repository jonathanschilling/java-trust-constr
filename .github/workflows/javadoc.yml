name: Deploy Javadoc to gh-pages

# Builds the javadoc and publishes it to the `gh-pages` branch on every push
# to `master` and on every release tag. Also exposed as a manual dispatch
# button on the Actions tab.
#
# One-time GitHub setup:
#   1. Settings -> Pages -> Source: "Deploy from a branch" -> Branch: `gh-pages`,
#      folder: `/ (root)`. Save.
#   2. Settings -> Actions -> General -> Workflow permissions:
#      "Read and write permissions" so the workflow can push to gh-pages.
#   3. Run this workflow once (manually) to seed the gh-pages branch.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # The parent POM `de.labathome:de-labathome-parent` is not on Maven
      # Central; check it out and `mvn install` it so the child build can
      # resolve the parent reference.
      - name: Checkout parent POM
        uses: actions/checkout@v4
        with:
          repository: jonathanschilling/de-labathome-parent
          path: parent-pom

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install parent POM
        run: mvn -B -q -f parent-pom/pom.xml install -DskipTests

      # The scipy/ submodule is the upstream Python reference; it's not needed
      # to build javadoc, so we skip submodules to keep the checkout fast.
      - name: Checkout java-trust-constr
        uses: actions/checkout@v4
        with:
          path: java-trust-constr

      - name: Build javadoc
        run: mvn -B -q -f java-trust-constr/pom.xml javadoc:javadoc

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: java-trust-constr/target/reports/apidocs
          publish_branch: gh-pages
          force_orphan: true   # keep gh-pages a single-commit history
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update javadoc from ${{ github.sha }}'
